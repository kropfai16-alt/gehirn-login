<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0C10">
<title>Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Manager: Lese-Ansicht des Gehirns. Liegt auf GitHub Pages, enthält keine Daten. Login wie der Chat (OAuth mit PKCE),
     danach liest die Seite über die Werkzeuge des MCP-Servers. Ändern geht weiter über den Chat. -->
<style>
:root{color-scheme:dark;--bg:#0A0C10;--karte:#12151C;--karte2:#171B24;--linie:rgba(255,255,255,.08);--text:#EEF1F6;--leise:#9AA3B2;
--akzent:#6EE7B7;--akzent-text:#06281C;--rot:#F9A8A8;--gelb:#FCD34D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(10,12,16,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linie)}
header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em;flex:1}
header button{background:none;border:0;color:var(--leise);font-size:14px;padding:6px 8px;border-radius:10px;cursor:pointer}
main{padding:12px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(18,21,28,.97);border-top:1px solid var(--linie);
padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--leise);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;
padding:6px 0;border-radius:12px;cursor:pointer}
nav button span{font-size:20px;line-height:1}
nav button.an{color:var(--akzent)}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:18px;padding:14px 16px;margin:0 0 12px}
.karte h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--leise);text-transform:uppercase;letter-spacing:.06em}
.zeile{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--linie)}
.zeile:first-of-type{border-top:0}
.zeile .l{min-width:0;flex:1}
.zeile .l small{display:block;color:var(--leise);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile .r{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.gross{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.minus{color:var(--rot)} .plus{color:var(--akzent)} .leise{color:var(--leise)} .warn{color:var(--gelb)}
.reiter{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.reiter button{flex:none;background:var(--karte);border:1px solid var(--linie);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer}
.reiter button.an{background:var(--akzent);color:var(--akzent-text);border-color:var(--akzent);font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--karte2);color:var(--leise);margin:2px 4px 0 0}
.chip.ok{color:var(--akzent)} .chip.w{color:var(--gelb)}
.knopf{display:block;width:100%;height:50px;border-radius:25px;border:0;background:var(--akzent);color:var(--akzent-text);font-size:16px;
font-weight:600;cursor:pointer;margin-top:14px}
.hinweis{color:var(--leise);font-size:13px;margin:6px 0 0}
.leer{color:var(--leise);text-align:center;padding:26px 8px}
.balken{height:6px;border-radius:3px;background:var(--karte2);overflow:hidden;margin-top:5px}
.balken i{display:block;height:100%;background:var(--akzent)}
.klick{cursor:pointer}
.mini{border:0;border-radius:999px;padding:6px 12px;background:var(--karte2);color:var(--akzent);font-size:13.5px;cursor:pointer;margin-left:6px}
.mini.leise{color:var(--leise)}
.formular{display:flex;gap:8px;flex-wrap:wrap}
.formular input,.formular select{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--linie);background:var(--karte2);color:var(--text);padding:0 12px;font-size:16px}
.formular .mini{height:42px;margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--akzent);color:var(--akzent-text);padding:9px 16px;border-radius:999px;
  font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.an{opacity:1}
input[type=search]{width:100%;height:42px;border-radius:14px;border:1px solid var(--linie);background:var(--karte);color:var(--text);
padding:0 14px;font-size:15px;margin:0 0 12px;outline:none}
.schritt{padding:6px 0 6px 28px;position:relative;border-top:1px solid var(--linie)}
.schritt b{position:absolute;left:0;top:6px;color:var(--akzent)}
.fehler{color:var(--rot)}
.laden{opacity:.55}
</style>
</head>
<body>
<header><h1 id="titel">Manager</h1><button id="neu" title="Neu laden">↻</button><button id="ab" hidden>Abmelden</button></header>
<div id="toast"></div>
<main id="inhalt"><p class="leer">Lädt …</p></main>
<nav id="nav" hidden>
  <button data-seite="start"><span>🏠</span>Heute</button>
  <button data-seite="geld"><span>💶</span>Geld</button>
  <button data-seite="kueche"><span>🥕</span>Küche</button>
  <button data-seite="sport"><span>🏃</span>Sport</button>
  <button data-seite="filme"><span>🎬</span>Filme</button>
</nav>
<script>
"use strict";
const SERVER = window.GEHIRN_SERVER || "https://cwuqbuyhdyrmmcykrymc.supabase.co/functions/v1/mcp";  // Überschreiben nur im Test
const RUECK = location.origin + location.pathname.replace(/index\.html$/, "");
const SPEICHER = "manager.v1";

// ---------- Hilfen ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (c, vz = false) => {
  if (c === null || c === undefined) return "–";
  const s = (Math.abs(c) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  return c < 0 ? "−" + s : (vz && c > 0 ? "+" + s : s);
};
const farbe = (c) => (c < 0 ? "minus" : c > 0 ? "plus" : "");
const datum = (d) => d ? new Date(String(d).length === 10 ? d + "T12:00:00" : d).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
const tagkurz = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }) : "";
const menge = (m, e) => m === null || m === undefined ? "" : `${Number(m).toLocaleString("de-DE", { maximumFractionDigits: 1 })} ${e ?? ""}`.trim();
const b64url = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const zufall = (n = 32) => b64url(crypto.getRandomValues(new Uint8Array(n)));

function laden() { try { return JSON.parse(localStorage.getItem(SPEICHER) || "{}"); } catch { return {}; } }
function sichern(z) { try { localStorage.setItem(SPEICHER, JSON.stringify(z)); } catch { } }
let zustand = laden();

// ---------- Anmeldung (OAuth 2.1 mit PKCE, wie der Chat) ----------
async function anmelden() {
  if (!zustand.client_id) {
    const r = await fetch(SERVER + "/register", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ client_name: "Manager-App", redirect_uris: [RUECK] }) });
    if (!r.ok) throw new Error("Registrierung fehlgeschlagen");
    zustand.client_id = (await r.json()).client_id;
  }
  const verifier = zufall(48);
  const state = zufall(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  zustand.pkce = { verifier, state };
  sichern(zustand);
  const u = new URL(SERVER + "/authorize");
  u.search = new URLSearchParams({ response_type: "code", client_id: zustand.client_id, redirect_uri: RUECK,
    code_challenge: challenge, code_challenge_method: "S256", state, scope: "gehirn", resource: SERVER });
  location.href = u.toString();
}

async function tokenHolen(params) {
  const r = await fetch(SERVER + "/token", { method: "POST", body: new URLSearchParams({ client_id: zustand.client_id, ...params }) });
  if (!r.ok) return false;
  const t = await r.json();
  zustand.access = t.access_token;
  zustand.refresh = t.refresh_token;
  zustand.ablauf = Date.now() + (t.expires_in - 60) * 1000;
  sichern(zustand);
  return true;
}

async function rueckkehrPruefen() {
  const p = new URLSearchParams(location.search);
  if (!p.get("code")) return;
  history.replaceState(null, "", RUECK);
  if (!zustand.pkce || p.get("state") !== zustand.pkce.state) throw new Error("Anmeldung ungültig, bitte erneut");
  const ok = await tokenHolen({ grant_type: "authorization_code", code: p.get("code"), redirect_uri: RUECK, code_verifier: zustand.pkce.verifier });
  delete zustand.pkce;
  sichern(zustand);
  if (!ok) throw new Error("Anmeldung fehlgeschlagen, bitte erneut");
}

async function gueltigesToken() {
  if (zustand.access && Date.now() < (zustand.ablauf || 0)) return zustand.access;
  if (zustand.refresh && await tokenHolen({ grant_type: "refresh_token", refresh_token: zustand.refresh })) return zustand.access;
  return null;
}

// ---------- Werkzeuge des Gehirns aufrufen (nur lesende) ----------
let rpcId = 0;
async function werkzeug(name, args = {}) {
  let token = await gueltigesToken();
  if (!token) throw new Error("ANMELDEN");
  const rufe = (t) => fetch(SERVER, { method: "POST", headers: { authorization: "Bearer " + t, "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method: "tools/call", params: { name, arguments: args } }) });
  let r = await rufe(token);
  if (r.status === 401) {
    zustand.ablauf = 0;
    token = await gueltigesToken();
    if (!token) throw new Error("ANMELDEN");
    r = await rufe(token);
  }
  if (!r.ok) throw new Error(`Server antwortet nicht (${r.status})`);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  const daten = JSON.parse(j.result.content[0].text);
  if (j.result.isError) throw new Error(daten.fehler || "Fehler");
  return daten;
}

// ---------- Darstellung ----------
const karte = (titel, inhalt) => `<section class="karte">${titel ? `<h2>${esc(titel)}</h2>` : ""}${inhalt}</section>`;
const zeile = (l, sub, r, cls = "", attr = "") =>
  `<div class="zeile ${attr ? "klick" : ""}" ${attr}><div class="l">${l}${sub ? `<small>${sub}</small>` : ""}</div><div class="r ${cls}">${r ?? ""}</div></div>`;
// Knopf, der ein Werkzeug aufruft (Ändern in der App); frage = Rückfrage vor dem Ausführen.
const tun = (text, werkzeugName, args, frage = "", cls = "") =>
  `<button class="mini ${cls}" data-tun="${werkzeugName}" data-args="${esc(JSON.stringify(args))}"${frage ? ` data-frage="${esc(frage)}"` : ""}>${text}</button>`;
function toast(t) {
  const el = $("#toast");
  el.textContent = t;
  el.classList.add("an");
  setTimeout(() => el.classList.remove("an"), 1800);
}
const leer = (t) => `<p class="leer">${esc(t)}</p>`;
const reiter = (liste, aktiv, name) => `<div class="reiter">${liste.map(([k, t]) =>
  `<button class="${k === aktiv ? "an" : ""}" data-${name}="${k}">${esc(t)}</button>`).join("")}</div>`;

let seite = (location.hash.slice(1).split("/")[0]) || "start";
const unter = { geld: "konten", kueche: "woche", filme: "tipp" };
let suche = "";

async function zeigen() {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("an", b.dataset.seite === seite));
  const ziel = $("#inhalt");
  ziel.classList.add("laden");
  try {
    ziel.innerHTML = await ({ start: seiteStart, geld: seiteGeld, kueche: seiteKueche, filme: seiteFilme, rezept: seiteRezept, faehig: seiteFaehig, sport: seiteSport, leute: seiteLeute, urlaub: seiteUrlaub }[seite] || seiteStart)();
  } catch (e) {
    if (e.message === "ANMELDEN") return zeigeLogin();
    ziel.innerHTML = karte("", `<p class="fehler">${esc(e.message)}</p><button class="knopf" onclick="zeigen()">Nochmal</button>`);
  } finally {
    ziel.classList.remove("laden");
  }
}

async function seiteStart() {
  $("#titel").textContent = "Heute";
  const [u, p, f] = await Promise.all([werkzeug("ueberblick"), werkzeug("cashflow_prognose", { tage: 30 }).catch(() => null),
    werkzeug("was_kannst_du").catch(() => null)]);
  const a = u.ausgaben_budgetmonat || {};
  const [von, bis] = (a.zeitraum || "").split(" bis ");
  let h = "";
  if (f && f.neu.length) h += karte("Neu im Manager", f.neu.slice(0, 4).map((n) => zeile(esc(n.text), [n.bereich, n.beispiel ? "„" + n.beispiel + "“" : ""].filter(Boolean).map(esc).join(" · "), "")).join("") +
    zeile("Alles, was der Manager kann", "", "›", "leise", 'data-seite="faehig"'));
  if ((u.erinnerungen || []).length) h += karte("Erinnerungen", u.erinnerungen.map((e) => zeile("⏰ " + esc(e.text),
    `${e.wochentag} ${e.faellig_am.slice(8, 10)}.${e.faellig_am.slice(5, 7)}. ${e.faellig_am.slice(11)}` + (e.wiederholung ? " · " + esc(e.wiederholung) : ""),
    tun("✓", "erinnerung_aendern", { id: e.id, status: "erledigt" }))).join(""));
  if ((u.anstoesse || []).length) h += karte("Steht an", u.anstoesse.map((a) => zeile(esc(a), "im Chat erledigen", "")).join(""));
  h += karte(`Budgetmonat ${datum(von).slice(0, 6)} – ${datum(bis).slice(0, 6)}`,
    `<div class="gross minus">${eur(-(a.summe_cent || 0))}</div><p class="hinweis">ausgegeben · Einnahmen ${eur(a.einnahmen_cent || 0)}</p>` +
    Object.entries(a.kategorien || {}).sort((x, y) => y[1] - x[1]).map(([k, v]) => {
      const pz = a.summe_cent ? Math.max(0, Math.round(100 * v / a.summe_cent)) : 0;
      return `<div class="zeile"><div class="l">${esc(k)}<div class="balken"><i style="width:${pz}%"></i></div></div><div class="r">${eur(v)}</div></div>`;
    }).join(""));
  if ((u.erwartete_buchungen || []).length) {
    h += karte("Erwartet", u.erwartete_buchungen.map((e) =>
      zeile(esc(e.auftrag), `${tagkurz(e.termin)} · ${esc(e.konto)}${e.nach ? " → " + esc(e.nach) : ""}${e.ueberfaellig ? ' · <span class="warn">überfällig</span>' : ""}`,
        (e.art === "umbuchung" ? eur(e.betrag_cent) : eur(e.betrag_cent, true)) + tun("✓", "termin_erledigen", { auftrag: e.auftrag, termin: e.termin },
          `${e.auftrag} ${eur(Math.abs(e.betrag_cent))} buchen?`), e.art === "umbuchung" ? "leise" : farbe(e.betrag_cent))).join(""));
  }
  if (p) {
    h += karte("Prognose Giro + Bargeld", `<div class="zeile"><div class="l">Heute</div><div class="r">${eur(p.stand_heute_cent)}</div></div>` +
      (p.wochen || []).map((w) => zeile("bis " + datum(w.bis), "", eur(w.stand_cent), farbe(w.stand_cent < 0 ? -1 : 0))).join("") +
      `<p class="hinweis">Tiefster Stand ${eur(p.tiefster_stand?.stand_cent)} am ${datum(p.tiefster_stand?.am)} · variable Ausgaben ca. ${eur(p.variable_ausgaben_pro_tag_cent)}/Tag</p>` +
      (p.wiederkehrend_angelegt ? "" : `<p class="warn">Noch keine festen Zahlungen angelegt – Gehalt, Miete und Raten fehlen in der Prognose. Im Chat anlegen.</p>`));
  }
  if ((u.bald_ablaufend || []).length) {
    h += karte("Bald aufbrauchen", u.bald_ablaufend.map((v) =>
      zeile(esc(v.produkt), v.stand === "wahrscheinlich" ? "wahrscheinlich da" : "", v.tage_bis_mhd <= 0 ? "heute" : `in ${v.tage_bis_mhd} T.`, v.tage_bis_mhd <= 1 ? "warn" : "")).join(""));
  }
  if ((u.essen_heute || []).length) {
    h += karte("Heute essen", u.essen_heute.map((e) => zeile(esc(e.titel), e.fehlt ? "fehlt: " + esc(e.fehlt.join(", ")) : "",
      e.status === "gekocht" ? "✓" : "›", e.status === "gekocht" ? "plus" : "leise", 'data-geh="kueche/woche"')).join(""));
  }
  if ((u.geburtstage_bald || []).length) {
    h += karte("Geburtstage", u.geburtstage_bald.map((p) => zeile(esc(p.person) + (p.wird ? ` <span class="leise">wird ${p.wird}</span>` : ""),
      tagkurz(p.naechster_geburtstag), p.tage_bis_geburtstag === 0 ? "heute 🎉" : `in ${p.tage_bis_geburtstag} T.`,
      p.tage_bis_geburtstag <= 3 ? "warn" : "leise", `data-leute="${esc(p.person)}"`)).join("") +
      zeile("Alle Freunde & Familie", "", "›", "leise", 'data-leute=""'));
  } else {
    h += karte("", zeile("Freunde & Familie", "", "›", "leise", 'data-leute=""'));
  }
  h += karte("", zeile("Urlaub & Reisen", "Resturlaub, Brückentage, Reisen", "›", "leise", 'data-seite="urlaub"'));
  if (u.sport_woche) {
    const sw = u.sport_woche;
    h += karte("Sport", zeile(`${sw.erledigt} von ${sw.ziel} Einheiten diese Woche`, (u.sport_heute || []).map((p) =>
      `heute: ${SPORT[p.art] || p.art}${p.status !== "geplant" ? " (" + p.status + ")" : ""}`).join(", "), "›", "leise", 'data-seite="sport"'));
  }
  h += karte("", zeile("Einkaufsliste", "", `${u.einkaufsliste_offen || 0} offen ›`, "", 'data-geh="kueche/einkauf"') +
    (u.letzter_bon ? zeile("Letzter Bon", esc(u.letzter_bon.markt) + " · " + datum(u.letzter_bon.am), eur(u.letzter_bon.summe_cent)) : ""));
  if ((u.offene_fragen || []).length) h += karte("Offene Fragen", u.offene_fragen.map((f) => zeile(esc(f.frage), "im Chat beantworten", "")).join(""));
  if ((u.notizen || []).length) h += karte("Gemerkt", u.notizen.map((n) => zeile(esc(n.text), esc(n.bereich), "")).join(""));
  return h;
}

async function seiteGeld() {
  $("#titel").textContent = "Geld";
  const t = unter.geld;
  let h = reiter([["konten", "Konten"], ["buchungen", "Buchungen"], ["wiederkehrend", "Wiederkehrend"], ["abos", "Abos"], ["kredite", "Kredite"]], t, "geld");
  if (t === "konten") {
    const [k, kats] = await Promise.all([werkzeug("konten_anzeigen"), werkzeug("kategorien_anzeigen").catch(() => [])]);
    h += karte("Schnell buchen", `<form class="formular" data-form="buchen">` +
      `<select name="art" style="flex:1 1 40%"><option value="ausgabe">Ausgabe</option><option value="einnahme">Einnahme</option></select>` +
      `<input name="betrag" inputmode="decimal" placeholder="Betrag €" required style="flex:1 1 40%">` +
      `<input name="notiz" placeholder="Wofür? (z. B. Tanken Aral)" style="flex:1 1 100%">` +
      `<input name="kategorie" list="kats" placeholder="Kategorie" style="flex:1 1 40%"><datalist id="kats">${kats.map((x) => `<option value="${esc(x.kategorie)}">`).join("")}</datalist>` +
      `<select name="konto" style="flex:1 1 40%">${k.konten.filter((x) => x.art === "giro" || x.art === "bargeld").map((x) => `<option>${esc(x.konto)}</option>`).join("")}</select>` +
      `<button class="mini" style="flex:1 1 100%">Buchen</button></form>`);
    const gruppen = { giro: "Giro", bargeld: "Bargeld", sparen: "Sparen", depot: "Depot", kredit: "Kredite" };
    h += karte("Gesamt", `<div class="gross ${farbe(k.gesamt_cent)}">${eur(k.gesamt_cent)}</div><p class="hinweis">Guthaben ${eur(k.guthaben_cent)} · Schulden ${eur(k.schulden_cent)}</p>`);
    for (const [art, name] of Object.entries(gruppen)) {
      const liste = k.konten.filter((x) => x.art === art);
      if (liste.length) h += karte(name, liste.map((x) => zeile(esc(x.konto), "", eur(x.stand_cent), farbe(x.stand_cent), `data-konto="${esc(x.konto)}"`)).join(""));
    }
  } else if (t === "buchungen") {
    const filter = zustand.kontoFilter ? { konto: zustand.kontoFilter } : {};
    const b = await werkzeug("buchungen_anzeigen", { ...filter, max: 100 });
    if (zustand.kontoFilter) h += `<p class="hinweis">Konto: <b>${esc(zustand.kontoFilter)}</b> · <a href="#" data-alle="1" style="color:var(--akzent)">alle zeigen</a></p>`;
    h += b.buchungen.length ? karte(`${b.anzahl} Buchungen`, b.buchungen.map((x) =>

    const [v, info] = await Promise.all([werkzeug("mit_person_schauen", { person: wer, anzahl: 6 }), werkzeug("personen_anzeigen", { person: wer })]);
    h += v.length ? karte("Mit " + wer + " schauen", v.map(film).join("")) : leer("Keine Vorschläge");
    if (info.lieblingsgenres) h += karte(wer + " mag", info.lieblingsgenres.map((g) => `<span class="chip ok">${esc(g)}</span>`).join("") +
      (info.gefaellt ? `<p class="hinweis">${esc(info.gefaellt.slice(0, 12).join(", "))}${info.gefaellt.length > 12 ? " …" : ""}</p>` : ""));
  } else if (t === "statistik") {
    const s = await werkzeug("filme_statistik");
    h += karte("Gesehen", zeile("Filme", "", s.filme_gesehen) + zeile("Serien", "", s.serien_gesehen) + zeile("Folgen", "", s.folgen_gesehen) +
      zeile("Stunden", "", s.stunden_geschaut) + zeile("Schnitt Bewertung", "", s.schnitt_bewertung ? "★ " + String(s.schnitt_bewertung).replace(".", ",") : "–"));
    if (s.lieblingsgenres) h += karte("Lieblingsgenres", s.lieblingsgenres.map((g) => `<span class="chip ok">${esc(g)}</span>`).join(""));
    if (s.je_dienst) h += karte("Lohnt sich das Abo?", Object.entries(s.je_dienst).map(([d, x]) => zeile(esc(d), "", `${x.gesehen} gesehen`)).join(""));
  } else {
    h += `<input type="search" id="suche" placeholder="Suchen …" value="${esc(suche)}">`;
    const f = t === "weiter" ? { weiterschauen: true } : { status: t };
    const l = await werkzeug("filme_anzeigen", { ...f, ...(suche ? { text: suche } : {}), max: 100 });
    h += l.titel.length ? karte(`${l.anzahl} Titel`, l.titel.map(film).join("")) : leer("Nichts gefunden");
  }
  return h;
}

function zeigeLogin(fehler = "") {
  $("#nav").hidden = true;
  $("#ab").hidden = true;
  $("#titel").textContent = "Manager";
  $("#inhalt").innerHTML = karte("", `<div style="font-size:22px;font-weight:650">Dein Gehirn auf einen Blick</div>
    <p class="hinweis">Konten, Buchungen, Einkaufsliste, Vorrat, Rezepte und Filme. Nur ansehen – ändern geht weiter im Chat.</p>
    ${fehler ? `<p class="fehler">${esc(fehler)}</p>` : ""}<button class="knopf" id="login">Mit Gehirn-Passwort anmelden</button>`);
  $("#login").onclick = () => anmelden().catch((e) => zeigeLogin(e.message));
}

// ---------- Ereignisse ----------
// Ändern in der App: Knopf ruft ein Werkzeug auf, danach wird die Seite neu geladen.
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-tun]");
  if (!b) return;
  ev.preventDefault();
  ev.stopPropagation();
  if (b.dataset.frage && !confirm(b.dataset.frage)) return;
  const args = JSON.parse(b.dataset.args);
  if (b.hasAttribute("data-bewerten")) {
    const n = prompt("Wie fandest du ihn? 1–10 (leer = ohne Bewertung)");
    if (n === null) return;
    if (n.trim()) {
      const z = parseInt(n, 10);
      if (!(z >= 1 && z <= 10)) return toast("Bitte 1 bis 10");
      args.bewertung = z;
    }
  }
  b.disabled = true;
  try {
    await werkzeug(b.dataset.tun, args);
    toast("Erledigt ✓");
    await zeigen();
  } catch (e) {
    b.disabled = false;
    if (e.message === "ANMELDEN") return zeigeLogin();
    toast(e.message);
  }
}, true);

document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest("[data-form]");
  if (!f) return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  let name, args, ok;
  if (f.dataset.form === "einkauf") {
    const t = (d.text || "").trim();
    if (!t) return;
    [name, args, ok] = ["einkauf_hinzufuegen", { eintraege: t.split(/\s*,\s*/).filter(Boolean).map((x) => ({ produkt: x, text: x })) }, "Auf der Liste ✓"];
  } else if (f.dataset.form === "buchen") {
    const cent = Math.round(parseFloat(String(d.betrag).replace(",", ".")) * 100);
    if (!cent) return toast("Betrag fehlt");
    [name, args, ok] = ["buchung_erfassen", { konto: d.konto, art: d.art, betrag_cent: cent, ...(d.kategorie ? { kategorie: d.kategorie } : {}),
      ...(d.notiz ? { notiz: d.notiz } : {}) }, "Gebucht ✓"];
  } else return;
  f.querySelectorAll("button,input").forEach((x) => (x.disabled = true));
  try {
    await werkzeug(name, args);
    toast(ok);
    await zeigen();
  } catch (e) {
    f.querySelectorAll("button,input").forEach((x) => (x.disabled = false));
    if (e.message === "ANMELDEN") return zeigeLogin();
    toast(e.message);
  }
});

document.addEventListener("click", (ev) => {
  const z = ev.target.closest("[data-leute],[data-seite],[data-geld],[data-kueche],[data-filme],[data-person],[data-rezept],[data-geh],[data-konto],[data-alle]");
  if (!z) return;
  ev.preventDefault();
  const d = z.dataset;
  if (d.seite) { seite = d.seite; location.hash = seite; }
  if (d.geld) { unter.geld = d.geld; if (d.geld !== "buchungen") zustand.kontoFilter = null; }
  if (d.kueche) unter.kueche = d.kueche;
  if (d.filme) { unter.filme = d.filme; suche = ""; }
  if (d.person) zustand.person = d.person;
  if (d.konto) { zustand.kontoFilter = d.konto; unter.geld = "buchungen"; }
  if (d.alle) zustand.kontoFilter = null;
  if (d.geh) { const [s, u] = d.geh.split("/"); seite = s; if (u) unter[s] = u; location.hash = s; }
  if (d.rezept) { seite = "rezept"; location.hash = "rezept/" + d.rezept; }
  if (d.leute !== undefined) { seite = "leute"; location.hash = "leute" + (d.leute ? "/" + encodeURIComponent(d.leute) : ""); }
  window.scrollTo(0, 0);
  zeigen();
});
let suchTimer;
document.addEventListener("input", (ev) => {
  if (ev.target.id !== "suche") return;
  clearTimeout(suchTimer);
  suchTimer = setTimeout(async () => { suche = ev.target.value.trim(); await zeigen(); const s = $("#suche"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 350);
});
window.addEventListener("hashchange", () => {
  const s = location.hash.slice(1).split("/")[0] || "start";
  if (s !== seite || s === "leute") { seite = s; zeigen(); }
});
$("#neu").onclick = () => zeigen();
$("#ab").onclick = () => { zustand = { client_id: zustand.client_id }; sichern(zustand); zeigeLogin(); };

(async () => {
  try {
    await rueckkehrPruefen();
  } catch (e) {
    return zeigeLogin(e.message);
  }
  if (!(await gueltigesToken())) return zeigeLogin();
  $("#nav").hidden = false;
  $("#ab").hidden = false;
  zeigen();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
